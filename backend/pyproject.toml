[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-copilot-backend"
version = "0.1.0"
description = "Enterprise AI Knowledge & Research Copilot - Production-grade Agentic RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "qdrant-client>=1.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.17.0",
    "rank-bm25>=0.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v -ra"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
