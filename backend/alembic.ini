[alembic]
# Path to migration scripts
script_location = backend/alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Timezone configuration
timezone = UTC

# Max length of characters for the slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py files
sourceless = false

# Version table name
version_table = alembic_version

# SQLAlchemy connection string is dynamically loaded in env.py from backend.app.config.settings
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/enterprise_copilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
